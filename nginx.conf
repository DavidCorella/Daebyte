server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/ld+json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sitio de una sola página: rutas inexistentes responden 404 real
    # (mejor para Google que un 200 con la portada)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
